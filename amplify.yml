# Hosting del frontend: no crea ni actualiza recursos del backend.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - |
          if [ "${VITE_DEMO_MODE:-false}" != "true" ]; then
            node -e '
              const config = JSON.parse(process.env.PARAMITA_OUTPUTS_JSON || "null");
              if (!config?.version || !config.auth?.user_pool_id ||
                  !config.auth?.user_pool_client_id || !config.custom?.apiUrl) {
                throw new Error("Configura PARAMITA_OUTPUTS_JSON con el User Pool, el cliente y la API.");
              }
              require("node:fs").writeFileSync("public/amplify_outputs.json", JSON.stringify(config));
            ' || exit 1
          fi
          npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
